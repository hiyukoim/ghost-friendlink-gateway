<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost FriendLink Gateway</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 2rem;
            max-width: 520px;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.5);
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }
        p {
            line-height: 1.6;
            color: #94a3b8;
        }
        a {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ghost FriendLink Gateway</h1>
        <p>This service generates per-member share links for private Ghost posts. Sign in via <code>/admin/login</code> to mint and manage tokens, or call the JSON APIs with <code>ADMIN_API_KEY</code>.</p>
        <p>Refer to the repository README for setup, privacy considerations, and API details.</p>
        <p><a href="https://github.com/hiyukoim/ghost-friendlink-gateway" target="_blank" rel="noopener">View documentation</a></p>
    </div>
</body>
</html>
