<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ site.title or "FriendLink Gateway" }} · Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 16px;
            padding: 2rem;
            width: min(420px, 100%);
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.6);
        }
        h1 {
            margin: 0 0 1.5rem 0;
            font-size: 1.6rem;
        }
        label {
            display: block;
            margin-bottom: 1rem;
        }
        label span {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: #cbd5f5;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.65rem 0.8rem;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
        }
        button {
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fecaca;
            padding: 0.65rem 0.8rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .meta {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 1rem;
            text-align: center;
        }
        @media (max-width: 520px) {
            body {
                padding: 1.5rem 1rem;
            }
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>{{ site.title or "FriendLink Gateway" }}</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('admin_login', next=next_url) }}">
            <label>
                <span>Username</span>
                <input type="text" name="username" autofocus required value="{{ username or '' }}">
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" required>
            </label>
            {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}
            <button type="submit">Sign in</button>
        </form>
        <p class="meta">Secure session login · rotates every {{ ADMIN_SESSION_HOURS or 12 }} hours.</p>
    </main>
</body>
</html>
