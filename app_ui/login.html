<!DOCTYPE html>
<html lang="en" data-bs-core="elegant">
<head>
    <meta charset="utf-8">
    <title>{{ site.title or "FriendLink Gateway" }} · Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/cores/halfmoon.elegant.css">
    <style>
        body {
            min-height: 100vh;
        }
        .content-wrapper {
            min-height: calc(100vh - 4rem);
        }
        .login-card {
            width: min(440px, 100%);
            padding: 2.5rem;
        }
        .login-actions {
            gap: 1.25rem;
        }
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
        }
    </style>
    <script>
        function updateTheme() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
        }
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-bs-theme');
            html.setAttribute('data-bs-theme', current === 'dark' ? 'light' : 'dark');
        }
        updateTheme();
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
    </script>
</head>
<body class="with-custom-webkit-scrollbars with-custom-css-scrollbars">
    <button class="btn btn-secondary btn-sm theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor" width="18" height="18">
            <path d="M303.3 112.7C196.2 121.2 112 210.8 112 320C112 434.9 205.1 528 320 528C353.3 528 384.7 520.2 412.6 506.3C309.2 482.9 232 390.5 232 280C232 214.2 259.4 154.9 303.3 112.7zM64 320C64 178.6 178.6 64 320 64C339.4 64 358.4 66.2 376.7 70.3C386.6 72.5 394 80.8 395.2 90.8C396.4 100.8 391.2 110.6 382.1 115.2C321.5 145.4 280 207.9 280 280C280 381.6 362.4 464 464 464C469 464 473.9 463.8 478.8 463.4C488.9 462.6 498.4 468.2 502.6 477.5C506.8 486.8 504.6 497.6 497.3 504.6C451.3 548.8 388.8 576 320 576C178.6 576 64 461.4 64 320z"/>
        </svg>
    </button>
    <div class="page-wrapper">
        <div class="content-wrapper d-flex align-items-center justify-content-center text-center py-30 px-20">
            <div class="card shadow-lg login-card mx-auto">
                <h1 class="font-size-22 mb-15">{{ site.title or "FriendLink Gateway" }}</h1>
                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}
                <form method="post" action="{{ url_for('admin.admin_login', next=next_url) }}" class="w-full">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               required
                               autofocus
                               value="{{ username or '' }}">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               required>
                    </div>
                    {% if next_url %}
                    <input type="hidden" name="next" value="{{ next_url }}">
                    {% endif %}
                    <button type="submit" class="btn btn-primary btn-block">
                        Sign in
                    </button>
                </form>
                <p class="text-muted font-size-12 mt-20 mb-0 text-center">
                    Sessions rotate every {{ ADMIN_SESSION_HOURS or 12 }} hours · CSRF protected
                </p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/halfmoon/js/halfmoon.min.js" defer></script>
</body>
</html>
